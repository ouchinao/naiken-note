included:
  - NaikenApp
  - NaikenWidget
  - NaikenKit/Sources
  - NaikenKit/Tests

opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument

disabled_rules:
  - implicit_return

trailing_comma:
  mandatory_comma: true

control_statement: error
trailing_semicolon: error
redundant_void_return: error
unused_closure_parameter: error
implicit_getter: error
syntactic_sugar: error
implicit_optional_initialization: error

line_length:
  warning: 140
  ignores_comments: true

identifier_name:
  excluded:
    - id

# 層ごとに import してよいフレームワーク(設計書 第4章)。ここにないものを import するとエラーになる
custom_rules:
  domain_imports:
    name: "Domain の import"
    included: 'NaikenKit/Sources/Domain/.+\.swift$'
    regex: '^\s*(?:@\w+\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:typealias|struct|class|enum|protocol|let|var|func)\s+)?(?!(?:typealias|struct|class|enum|protocol|let|var|func|Foundation)\b)\w+'
    message: "Domain は Foundation だけに依存する。UIやストレージの型を持ち込まない"
    severity: error
  data_imports:
    name: "Data の import"
    included: 'NaikenKit/Sources/Data/.+\.swift$'
    regex: '^\s*(?:@\w+\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:typealias|struct|class|enum|protocol|let|var|func)\s+)?(?!(?:typealias|struct|class|enum|protocol|let|var|func|Foundation|Domain|SwiftData|CoreData)\b)\w+'
    message: "Data は Domain と SwiftData だけに依存する(CoreData は同期通知の名前のためだけに使う)"
    severity: error
  platform_imports:
    name: "Platform の import"
    included: 'NaikenKit/Sources/Platform/.+\.swift$'
    regex: '^\s*(?:@\w+\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:typealias|struct|class|enum|protocol|let|var|func)\s+)?(?!(?:typealias|struct|class|enum|protocol|let|var|func|Foundation|Domain|ImageIO|UniformTypeIdentifiers|StoreKit|CloudKit|ARKit|Photos|CoreLocation|WidgetKit)\b)\w+'
    message: "Platform は画面を持たないOS機能だけを扱う。SwiftUI・UIKit・SwiftData は import しない(CloudKit は iCloud の状態を確かめるためだけに使う)"
    severity: error
  design_system_imports:
    name: "DesignSystem の import"
    included: 'NaikenKit/Sources/DesignSystem/.+\.swift$'
    regex: '^\s*(?:@\w+\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:typealias|struct|class|enum|protocol|let|var|func)\s+)?(?!(?:typealias|struct|class|enum|protocol|let|var|func|Foundation|SwiftUI|UIKit)\b)\w+'
    message: "DesignSystem は表示部品だけを持ち、業務(Domain)を知らない"
    severity: error
  features_imports:
    name: "Features の import"
    included: 'NaikenKit/Sources/Features/.+\.swift$'
    regex: '^\s*(?:@\w+\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:typealias|struct|class|enum|protocol|let|var|func)\s+)?(?!(?:typealias|struct|class|enum|protocol|let|var|func|Foundation|Observation|Domain|DesignSystem|SwiftUI|PhotosUI|UIKit|StoreKit|ARKit|SceneKit)\b)\w+'
    message: "Features は Data・Platform・SwiftData を import しない(ARKit は AR の表示、StoreKit はレビュー依頼のためだけに使う)"
    severity: error
  widget_imports:
    name: "ウィジェットの import"
    included: 'NaikenWidget/.+\.swift$'
    regex: '^\s*(?:@\w+\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:typealias|struct|class|enum|protocol|let|var|func)\s+)?(?!(?:typealias|struct|class|enum|protocol|let|var|func|Foundation|SwiftUI|WidgetKit|Domain|DesignSystem)\b)\w+'
    message: "ウィジェットは App Group に書かれた内見予定だけを読み、SwiftData のストアを開かない"
    severity: error
  view_model_imports:
    name: "ViewModel の import"
    included: 'NaikenKit/Sources/Features/.+ViewModel\.swift$'
    regex: '^\s*(?:@\w+\s+)*(?:(?:public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:typealias|struct|class|enum|protocol|let|var|func)\s+)?(?!(?:typealias|struct|class|enum|protocol|let|var|func|Foundation|Observation|Domain)\b)\w+'
    message: "ViewModel は SwiftUI・UIKit を import しない。表示の型に頼ると画面なしでテストできなくなる"
    severity: error
